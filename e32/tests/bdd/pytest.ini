; pytest-bdd layer for e32: binds docs/features/<level>/*.feature, except
; scenarios tagged @gtest (the GoogleTest suite implements those).
; Run from the e32 directory:  python3 -m pytest tests/bdd
;
; The environment tags are registered here.  Requirement, VER, epic and
; feature tags (SYS-12, VER-SYS-09, EP-01, FEAT-004, US-12, ...) contain hyphens; the
; conftest turns each into a marker with "-" replaced by "_" (SYS_12,
; VER_SYS_09, ...) and registers every such marker it finds in the feature
; files, so the list never has to be kept by hand and --strict-markers holds.
[pytest]
addopts = --strict-markers
python_functions = test_*
markers =
    host: runs on the build host (some steps still need the cross toolchain)
    qemu: needs Espressif's qemu-system-xtensa and the xtensa-esp32-elf cross compiler
    hardware: needs a physical ESP32 board on $E32_PORT
    pending: no executable automation yet; fails with "PENDING automation:" (red state)
    gtest: implemented by the GoogleTest suite (tests/gtest); deselected here
